[package]
name = "enzimos-dictation"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Hold a key, speak, and the words land in the text field you are typing in"

[dependencies]
enzui-activity = { git = "https://github.com/enz1m/enzui.git", rev = "ac1a3d759d40c9f9f26f3b80b40e508dea086776" }
async-channel = "2"
async-io = "2"
base64 = "0.22"
futures-lite = "2"
libc = "0.2"
serde_json = "1"
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "=5.18.0", default-features = false, features = ["blocking-api", "async-io"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
or_fun_call = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
explicit_iter_loop = "warn"
ignored_unit_patterns = "warn"
string_slice = "warn"
unwrap_in_result = "warn"
panic = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
